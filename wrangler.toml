# Cloudflare Worker (static assets): staff app, production instance "ethos-referrals".
# Built from the GitHub repository (Workers Builds): build command `npm run build`, deploy command
# `npx wrangler deploy`. The seed (real patient data) is gitignored, so builds from GitHub contain
# no patient records. Never deploy a local build that contains dist/seed until Cloudflare Access
# protects the hostname.
#
# Do not put secrets here. Build variables (VITE_DATA_ADAPTER, VITE_SUPABASE_URL,
# VITE_SUPABASE_ANON_KEY, VITE_TURNSTILE_SITE_KEY) are set in the Worker's build settings and read
# by Vite at build time.

name = "ethos-referrals"
compatibility_date = "2026-01-15"

[assets]
directory = "./dist"
# Every route that is not a file serves the app shell (React Router handles it).
not_found_handling = "single-page-application"
